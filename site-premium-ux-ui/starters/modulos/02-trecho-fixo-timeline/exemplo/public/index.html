<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo 2 · Trecho fixo com timeline presa à rolagem</title>
<meta name="description" content="Exemplo mínimo do módulo trecho fixo: a foto aproxima, o título sai e a cena encolhe num cartão conforme a rolagem.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b4552f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main id="conteudo">
  <section class="trecho" id="trecho" data-aproxima-ate=".55" data-cartao-px="433" data-cartao-celular=".6" data-cartao-duracao=".39" aria-labelledby="t-trecho">
    <div class="trecho-palco">
      <div class="trecho-cartao">
        <img class="trecho-foto" src="img/cena.webp" width="1440" height="900" alt="Paisagem de serras em camadas ao entardecer, com o sol baixo à direita">
      </div>
      <div class="trecho-texto">
        <h1 id="t-trecho">A cena se fecha enquanto você rola</h1>
        <p class="trecho-base">Ao fim da rolagem, a foto vira um cartão no meio da página.</p>
      </div>
    </div>
  </section>
  <section class="fecho"><h2>Fim do trecho fixo.</h2><p>A altura da seção (400vh) é a duração da cena.</p></section>
</main>
</body>
</html>
