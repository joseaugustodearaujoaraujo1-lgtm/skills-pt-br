<!-- Cursor customizado: o JS cria os dois elementos abaixo se não existirem (só com mouse). Marque o que muda o cursor com data-cursor. -->
<div class="cursor" aria-hidden="true"><span class="cursor-ponto"></span><span class="cursor-anel"><span class="cursor-rotulo"></span></span></div>

<a href="#x">Link comum: o anel cresce</a>
<div class="cartao" data-cursor="Arraste">Área com rótulo: o anel vira um disco com a palavra</div>
<button data-cursor="ocultar">Campo que esconde o cursor (ex.: vídeo com controles)</button>
