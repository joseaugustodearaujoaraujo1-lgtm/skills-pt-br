<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo 5 · Painel de vidro</title>
<meta name="description" content="Exemplo mínimo do módulo painel de vidro: desfoque, tinta e aresta clara sobre uma imagem de fundo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b4552f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main id="conteudo">
  <section class="vidro-cena">
    <img class="vidro-fundo" src="img/fundo.webp" width="1440" height="900" alt="">
    <div class="vidro" data-desfoque="26" data-tinta=".34">
      <h1>Vidro sobre cor</h1>
      <p>O painel desfoca o que passa atrás dele. A tinta escura garante a leitura; a aresta clara dá a sensação de material.</p>
      <a class="vidro-acao" href="#claro">Ver a variante clara</a>
    </div>
  </section>
  <section class="vidro-cena" id="claro">
    <img class="vidro-fundo" src="img/fundo.webp" width="1440" height="900" alt="" style="transform: scaleX(-1)">
    <div class="vidro claro" data-desfoque="14" data-tinta=".78">
      <h2>Variante clara</h2>
      <p>Tinta clara e texto escuro. Textos longos pedem tinta forte (≥ .78); textos curtos aguentam .3.</p>
      <a class="vidro-acao" href="#claro">Ação</a>
    </div>
  </section>
</main>
</body>
</html>
