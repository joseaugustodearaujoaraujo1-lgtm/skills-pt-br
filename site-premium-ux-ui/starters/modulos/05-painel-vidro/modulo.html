<!-- Painel de vidro: precisa de algo VISÍVEL atrás (foto, vídeo, cena). O vidro é o irmão posterior do fundo, nunca filho dele com opacity/filter. -->
<section class="vidro-cena">
  <img class="vidro-fundo" src="img/fundo.webp" width="1440" height="900" alt="">
  <div class="vidro" data-desfoque="26" data-tinta=".34">
    <h2>[Título do painel]</h2>
    <p>[Texto curto: 2 a 4 linhas, em cor clara de contraste ≥ 4,5:1 sobre a tinta]</p>
    <a class="vidro-acao" href="#contato">[Ação]</a>
  </div>
  <!-- Variantes: .vidro.pilula (menu/rodapé de carrossel), .vidro.claro (tinta clara, texto escuro) -->
</section>
