<!doctype html>
<!--
  Molde do elemento 3D feito pelo próprio agente (etapa 1 de references/pipeline-3d.md), sem gerador de imagem e sem custo.
  Copie para referencias-3d/<obj>/1-molde/molde.html e desenhe cada vista em SVG, a partir das referências do usuário:
  - mesmas medidas em todas as vistas (1 unidade do viewBox = 1 mm; ajuste VIEWBOX abaixo ao tamanho do objeto);
  - silhueta exata, chanfros, número de peças, e cada material com degradê que mostre o acabamento (metal, vidro, borracha...);
  - cotas das medidas principais (classe "cota") e a ficha de materiais em #materiais.
  Sem parâmetro: folha com as 5 vistas + materiais (para o usuário aprovar).
  ?vista=frente|lado|tres-quartos|costas|topo: uma vista só (para comparar com o Blender e o Three.js).
  Capture: node <skill>/scripts/capturar-vistas-three.mjs --url "file:///.../molde.html" --saida referencias-3d/<obj>/1-molde --lado 1024
-->
<html lang="pt-BR">
<meta charset="utf-8">
<title>Molde · OBJETO</title>
<style>
  :root { --fundo: #e9e9e9; --linha: #1d2226; --cota: #c2410c; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--fundo); font: 14px/1.4 system-ui, sans-serif; color: var(--linha); padding: 24px; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  .folha { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  figure { background: #f4f4f4; border: 1px solid #ccc; aspect-ratio: 1; position: relative; }
  figcaption { position: absolute; left: 10px; top: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  svg { width: 100%; height: 100%; display: block; }
  .cota { stroke: var(--cota); fill: var(--cota); font-size: 3px; stroke-width: .25; }
  #materiais { background: #f4f4f4; border: 1px solid #ccc; padding: 12px; }
  #materiais li { list-style: none; display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  #materiais i { width: 28px; height: 28px; border-radius: 4px; display: inline-block; }
  /* vista única: só ela, ocupando a tela, sem textos (igual às vistas do Blender) */
  html[data-vista] body { padding: 0; }
  html[data-vista] h1, html[data-vista] #materiais, html[data-vista] figcaption, html[data-vista] .cota { display: none; }
  html[data-vista] .folha { display: block; }
  html[data-vista] figure { display: none; position: fixed; inset: 0; border: 0; background: var(--fundo); aspect-ratio: auto; }
  html[data-vista] figure.ativa { display: block; }
</style>
<h1>Molde · OBJETO · medidas em mm</h1>
<div class="folha">
  <!-- Mesmo viewBox nas 5 vistas: o objeto fica na mesma escala. Centro do objeto em (0,0). -->
  <figure data-vista="frente"><figcaption>Frente</figcaption>
    <svg viewBox="-30 -30 60 60"><!-- desenhe a vista de frente aqui --></svg></figure>
  <figure data-vista="lado"><figcaption>Lado</figcaption>
    <svg viewBox="-30 -30 60 60"><!-- lado direito (+X) --></svg></figure>
  <figure data-vista="tres-quartos"><figcaption>3/4</figcaption>
    <svg viewBox="-30 -30 60 60"><!-- 45° entre frente e lado, câmera 20° acima --></svg></figure>
  <figure data-vista="costas"><figcaption>Costas</figcaption>
    <svg viewBox="-30 -30 60 60"><!-- costas --></svg></figure>
  <figure data-vista="topo"><figcaption>Topo</figcaption>
    <svg viewBox="-30 -30 60 60"><!-- de cima, frente para baixo --></svg></figure>
  <section id="materiais"><h1>Materiais</h1><ul>
    <!-- um item por material: amostra + valores que o Blender e o Three.js vão usar -->
    <li><i style="background:linear-gradient(135deg,#f4f6f6,#8d999c 45%,#e4eaea 55%,#4a5559)"></i> Aço escovado · metalness 1 · roughness 0,3 · grão circular</li>
  </ul></section>
</div>
<script>
  const v = new URLSearchParams(location.search).get('vista');
  const alvo = v && document.querySelector(`figure[data-vista="${v}"]`);
  if (alvo) { document.documentElement.dataset.vista = v; alvo.classList.add('ativa'); }
</script>
</html>
