<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo 6 · Cursor customizado</title>
<meta name="description" content="Exemplo mínimo do módulo cursor customizado: ponto e anel que seguem o mouse, crescem sobre links e mostram rótulos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b4552f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
<style>
  .area { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 3vw; padding: 3rem 6vw 6rem; }
  .area > * { min-height: 240px; display: grid; place-items: center; text-align: center; padding: 1.5rem; border-radius: 12px; text-decoration: none; font: inherit; }
  .link { background: var(--cor-escura); color: var(--cor-claro); }
  .cartao { color: #1d1b17; background: #e7b48f; }
  .botao { border: 2px solid var(--cor-texto); background: transparent; color: var(--cor-texto); cursor: pointer; }
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main id="conteudo">
  <header class="intro"><h1>Mova o mouse.</h1><p>Um ponto e um anel acompanham o ponteiro. No celular e com movimento reduzido nada disso liga, e o cursor nativo nunca é escondido.</p></header>
  <section class="area" aria-label="Estados do cursor">
    <a class="link" href="#conteudo">Link: o anel cresce</a>
    <div class="cartao" data-cursor="Arraste">Área com data-cursor="Arraste": o anel vira um disco com a palavra</div>
    <button class="botao" type="button" data-cursor="ocultar">data-cursor="ocultar": o cursor some</button>
  </section>
</main>
</body>
</html>
